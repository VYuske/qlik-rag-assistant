services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATA_RAW_DIR: /app/data/raw/qlik
      CHROMA_PERSIST_DIR: /app/data/vectorstore/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data

  ui:
    build: .
    entrypoint: ["python", "-m", "streamlit", "run", "/app/src/qlik_rag/ui/app.py"]
    command:
      - "--server.address=0.0.0.0"
      - "--server.port=8501"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATA_RAW_DIR: /app/data/raw/qlik
      CHROMA_PERSIST_DIR: /app/data/vectorstore/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
